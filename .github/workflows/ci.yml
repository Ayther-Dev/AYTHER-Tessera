name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: tessera-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            third_party/cache/nlohmann-json-3.12.0
            third_party/cache/picosha2-1.0.1
            third_party/cache/doctest-2.5.3
          key: ${{ runner.os }}-headers-${{ hashFiles('cmake/dependencies.lock.json') }}
      - name: Prepare and verify pinned headers
        run: ./tools/bootstrap-dependencies.ps1 -Download
      - name: Configure, build and test available core suites
        run: ./tools/check.ps1 -Preset windows-dev -Jobs 2
      # Engine and Runtime acceptance run in their declared environments when implemented.
      # Unit, C/C++ contracts, CLI, fresh-process replay and the installed package consumer share this CTest job.
